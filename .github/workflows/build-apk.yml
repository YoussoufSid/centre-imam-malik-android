name: Build Android APK

on:
  push:
    branches: [ main, "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the GitHub Release on main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build APKs (optimised release + debug)
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report
          path: app/build/reports/tests/
          retention-days: 7
      - name: Upload optimised APK
        uses: actions/upload-artifact@v4
        with:
          name: Centre-Imam-Malik-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Centre-Imam-Malik-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      # On main: publish a GitHub Release with a fixed asset name, so the phone app and the website can
      # always point to .../releases/latest/download/centre-imam-malik.apk (public, no login, no zip).
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk centre-imam-malik.apk
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" centre-imam-malik.apk --clobber
          else
            gh release create "v$V" centre-imam-malik.apk --target "$GITHUB_SHA" --latest \
              --title "مركز الإمام مالك — الإصدار $V" \
              --notes "تطبيق الهاتف لمركز الإمام مالك. للتثبيت: نزّل centre-imam-malik.apk وافتحه على الهاتف."
          fi
