name: Build Android APK

on:
  push:
    branches: [ main, "claude/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Build APKs (optimised release + debug)
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report
          path: app/build/reports/tests/
          retention-days: 7
      - name: Upload optimised APK
        uses: actions/upload-artifact@v4
        with:
          name: Centre-Imam-Malik-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Centre-Imam-Malik-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
