name: Build Android APK

on:
  push:
    branches: [ main, "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the GitHub Release on main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node (website logic tests)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run website logic tests
        run: node --test web/tests/*.test.mjs
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace
      # Private release key (optional): add the four repository secrets below to sign the release APK with it.
      # Without them the build falls back to the public debug key (installable, but not secure against look-alike APKs).
      - name: Prepare private release key (if configured)
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_STORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            echo "Signing the release APK with the private key."
          else
            echo "No private key configured: using the debug key."
          fi
      - name: Build APKs (optimised release + debug)
        run: gradle :app:assembleRelease :app:assembleDebug --stacktrace
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Report
          path: app/build/reports/tests/
          retention-days: 7
      - name: Upload optimised APK
        uses: actions/upload-artifact@v4
        with:
          name: Centre-Imam-Malik-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload debug APK (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: Centre-Imam-Malik-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      # On main: publish a GitHub Release with a fixed asset name, so the phone app and the website can
      # always point to .../releases/latest/download/centre-imam-malik.apk (public, no login, no zip).
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk centre-imam-malik.apk
          # SHA-256 next to the APK: the app checks the download against it before installing
          sha256sum centre-imam-malik.apk | cut -d' ' -f1 > centre-imam-malik.apk.sha256
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" centre-imam-malik.apk centre-imam-malik.apk.sha256 --clobber
          else
            gh release create "v$V" centre-imam-malik.apk centre-imam-malik.apk.sha256 --target "$GITHUB_SHA" --latest \
              --title "مركز الإمام مالك — الإصدار $V" \
              --notes "تطبيق الهاتف لمركز الإمام مالك. للتثبيت: نزّل centre-imam-malik.apk وافتحه على الهاتف."
          fi
